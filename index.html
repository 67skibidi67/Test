<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon Labo de Spam</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #121212; color: white; }
        .container { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; padding: 20px; }
        button { 
            padding: 15px 25px; cursor: pointer; border: none; border-radius: 5px;
            background: #3498db; color: white; font-weight: bold;
        }
        button:active { background: #2980b9; }
        #log-container {
            margin-top: 30px; padding: 20px; background: #1e1e1e;
            border-radius: 10px; max-width: 600px; margin-left: auto; margin-right: auto;
            max-height: 300px; overflow-y: auto; text-align: left; border: 1px solid #333;
        }
        .log-entry { font-family: monospace; border-bottom: 1px solid #333; padding: 5px; color: #00ff00; }
    </style>
</head>
<body>

    <h1>Répertoire de test de clic</h1>
    <p>Utilise tes scripts de spam sur ces boutons !</p>

    <div class="container">
        <button class="instant" id="btn-1">Bouton 1</button>
        <button class="instant" id="btn-2">Bouton 2</button>
        <button class="instant" id="btn-3">Bouton 3</button>
        <button class="instant" id="btn-4">Bouton 4</button>
        <button class="instant" id="btn-5">Bouton 5</button>
        <button class="instant" id="btn-6">Bouton 6</button>
    </div>

    <div id="log-container">
        <div class="log-entry">> Système prêt. En attente de clics...</div>
    </div>

    <script>
        // Ce script interne sert à afficher les clics dans le "répertoire" sur la page
        const logContainer = document.getElementById('log-container');
        let clickCount = 0;

        document.querySelectorAll('.instant').forEach(button => {
            button.addEventListener('click', () => {
                clickCount++;
                const entry = document.createElement('div');
                entry.className = 'log-entry';
                entry.textContent = `[${clickCount}] CLIC DÉTECTÉ sur : ${button.id} à ${new Date().toLocaleTimeString()}`;
                
                // Ajouter au début du log
                logContainer.insertBefore(entry, logContainer.firstChild);

                // Limiter à 50 lignes pour ne pas faire ramer la page
                if (logContainer.childNodes.length > 50) {
                    logContainer.removeChild(logContainer.lastChild);
                }
            });
        });
    </script>
</body>
</html>
